apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transmission.fullname" . }}
  namespace: {{ include "transmission.namespace" . }}
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Transmission keeps state in /config and /downloads; never run two
  # pods side by side, so use Recreate instead of RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "transmission.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The following annotations make sure that in case of
        # update/upgrade a new deployment gets triggered
        checksum/configmap.yaml: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets.yaml: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/install_info: {{ printf "%s-%s" .Chart.Name .Chart.Version | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "transmission.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "transmission.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      initContainers:
        - name: custom-webui
          image: "{{ .Values.webui.image }}:{{ .Values.webui.imageTag }}"
          # The cache dir lives in the config volume: root is needed because
          # on first boot the kubelet may have created the hostPath dir with
          # root ownership only.
          securityContext:
            runAsUser: 0
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              V="{{ .Values.webui.releaseVersion }}"
              URL="https://github.com/johman10/flood-for-transmission/releases/download/${V}/flood-for-transmission.tar.gz"
              CACHE=/config/webui-cache
              TARBALL="${CACHE}/flood-for-transmission.tar.gz"
              if [ "$(cat "${CACHE}/version" 2>/dev/null)" = "${V}" ] && [ -s "${TARBALL}" ]; then
                echo "webui: using cached release ${V}"
              else
                mkdir -p "${CACHE}" 2>/dev/null || true
                curl -fsSL --retry 5 --retry-connrefused -o "${TARBALL}.new" "${URL}" \
                  && mv "${TARBALL}.new" "${TARBALL}" \
                  && echo "${V}" > "${CACHE}/version" \
                  || { rm -f "${TARBALL}.new"; echo "webui: download failed, falling back to existing cache"; }
              fi
              tar -C /ui -xzf "${TARBALL}"
          volumeMounts:
            - name: ui-volume
              mountPath: /ui
            - name: config-volume
              mountPath: /config
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http 
              containerPort: 9091
              protocol: TCP
            - name: tcp
              containerPort: 51413
              protocol: TCP
            - name: udp
              containerPort: 51413
              protocol: UDP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /downloads
              name: downloads-volume
            - mountPath: /config
              name: config-volume
            - name: ui-volume
              mountPath: /ui
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transmission.fullname" .)) }}
                  key: transmission-password
          envFrom:
            - configMapRef:
                name: {{ include "transmission.fullname" . }}-config
                optional: false
      volumes:
        - name: downloads-volume
          hostPath:
            path: {{ .Values.persistence.downloads.hostPath | default ((.Values.configMap).downloads) | default "/mnt" }}
            type: DirectoryOrCreate
        - name: config-volume
          hostPath:
            path: {{ .Values.persistence.config.hostPath | default ((.Values.configMap).config) | default "/opt/transmission/config" }}
            type: DirectoryOrCreate
        - name: ui-volume
          emptyDir:
            sizeLimit: 500Mi
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
