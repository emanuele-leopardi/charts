apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "transmission.fullname" . }}-test-connection"
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    # Plain TCP check: wget/curl would get a 401 because Transmission
    # requires basic auth on every HTTP path when USER/PASS are set.
    - name: port-check
      image: busybox:1.36
      command: ['sh', '-c']
      args: ['nc -z -w 5 {{ include "transmission.fullname" . }} {{ .Values.service.port | default 9091 }}']
  restartPolicy: Never
