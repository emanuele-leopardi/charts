# Default values for transmission.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: lscr.io/linuxserver/transmission
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

configMap:
  tz: UTC
  transmissionWebHome: "/ui/flood-for-transmission"
  puid: "1000"
  pgid: "1000"
  user: admin

# Alternative web UI (flood-for-transmission) downloaded into an emptyDir
# by an init container on every pod start. Versions are pinned on purpose.
webui:
  image: curlimages/curl
  imageTag: "8.11.1"
  releaseVersion: "v1.0.1"

ui:
  darkMode: "enabled"
  switchColors: "true"
  notation24H: "true"
  wrapHeader: "true"
  commonPath: ""
  columns: "[{ label: \"Name\", width: 400, enabled: true }, { label: \"Progress\", width: 600 }, { label: \"Ratio\", width: 0, enabled: false }]"
  sortColumn: "Ratio"
  sortDirection: "asc"
  showDiskUsage: "true"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9091

ingress:
  # -- Enable Ingress Creation (disabled by default; enable in your own values)
  enabled: false
  ingresses:
    - className: ""
      # -- Annotations on the ingress object.
      annotations: {}
      labels: {}
      # -- The hostname that should be used.
      hosts:
        - host: transmission.local
          paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: transmission
                  port:
                    number: 9091
      tls: []
      #  - secretName: chart-example-tls
      #    hosts:
      #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /transmission/web/
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /transmission/web/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# Transmission is stateful; scaling beyond one replica is not supported,
# so autoscaling should stay disabled.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
